name: Build and offline test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore pix-dynamic-payload-generator.net.sln
      - run: dotnet build pix-dynamic-payload-generator.net.sln --configuration Release --no-restore
      - run: dotnet test pix-dynamic-payload-generator.net.sln --configuration Release --no-build --filter 'TestCategory!=Integration'
